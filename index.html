<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Connectifit Gamified Overlay</title>
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: Arial, sans-serif;
    }

    /* VDO.Ninja Video Background Container */
    #vdo-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      border: none;
      pointer-events: none; /* Allows touch events to fall through if needed */
    }

    /* Interactive Overlay Canvas Layer */
    #overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10; /* Sits cleanly ABOVE the video layer */
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 20px;
      pointer-events: auto; /* Forces 100% touch interactivity on mobile */
    }

    /* Cards Styling */
    .card {
      width: 100px;
      height: 150px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      border: 2px solid #00d2ff;
    }

    .card-front {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .card-back {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      transform: rotateY(180deg);
    }

    /* Locked state when client taps a card */
    .card.disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(80%);
    }
  </style>
</head>
<body>

  <!-- Background VDO.Ninja Frame (Dynamically injected if client mode) -->
  <iframe id="vdo-container" allow="camera; microphone; autoplay"></iframe>

  <!-- Foreground Touch Interactive Overlay -->
  <div id="overlay-container">
    <div class="card" id="card1" onclick="selectCard('card1')">
      <div class="card-inner">
        <div class="card-front">Card 1</div>
        <div class="card-back">Selected</div>
      </div>
    </div>
    <div class="card" id="card2" onclick="selectCard('card2')">
      <div class="card-inner">
        <div class="card-front">Card 2</div>
        <div class="card-back">Selected</div>
      </div>
    </div>
    <div class="card" id="card3" onclick="selectCard('card3')">
      <div class="card-inner">
        <div class="card-front">Card 3</div>
        <div class="card-back">Selected</div>
      </div>
    </div>
  </div>

  <script>
    // URL Parameter Parsing
    const urlParams = new URLSearchParams(window.location.search);
    const isClient = urlParams.get('client') === 'true';
    const roomName = urlParams.get('room') || 'CLS2026';

    // Ably Realtime Setup
    const ably = new Ably.Realtime('PaqQqA.Z2mwNw:eC01Vbna9gRftKwSPQAGqQAX4_3aXU4alNy342yGYK8');
    const channel = ably.channels.get('connectifit-cards');

    let hasSelected = false;

    // Load VDO.Ninja into background iframe on client mobile
    const vdoFrame = document.getElementById('vdo-container');
    if (isClient) {
      vdoFrame.src = `https://vdo.ninja/?push&room=${roomName}&webcam&transparent&cover&clean&nocontrols`;
    } else {
      // In Streamlabs mode, hide iframe background so scene stays transparent
      vdoFrame.style.display = 'none';
    }

    // Card Selection Logic
    function selectCard(cardId) {
      if (hasSelected && isClient) return; // Restrict client to 1 selection

      flipAndHighlight(cardId);

      // Broadcast event via Ably
      channel.publish('card-flip', { cardId: cardId });

      if (isClient) {
        hasSelected = true;
        lockOtherCards(cardId);
      }
    }

    function flipAndHighlight(cardId) {
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.add('flipped');
      }
    }

    function lockOtherCards(selectedId) {
      ['card1', 'card2', 'card3'].forEach(id => {
        if (id !== selectedId) {
          const card = document.getElementById(id);
          if (card) card.classList.add('disabled');
        }
      });
    }

    // Listen for Sync Signals (Streamlabs / Director View)
    channel.subscribe('card-flip', (message) => {
      if (!isClient) {
        flipAndHighlight(message.data.cardId);
      }
    });
  </script>
</body>
</html>
