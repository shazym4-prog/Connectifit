<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Connectifit Gamified Overlay</title>
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: Arial, sans-serif;
    }

    /* Container for the cards */
    #overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    /* Base Card Styling */
    .card {
      width: 120px;
      height: 180px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 2px solid #00d2ff;
    }

    /* Card Back (Default Face Down Graphic) */
    .card-front {
      background-image: url('card-back.png'); /* Ensure your card back image file matches this filename */
      background-color: #1a1a1a;
    }

    /* Card Front (Flipped Image Graphic) */
    .card-back {
      background-image: url('card-front.png'); /* Ensure your card front image file matches this filename */
      background-color: #00d2ff;
      transform: rotateY(180deg);
    }

    /* Disabled/Locked state when selected */
    .card.disabled {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="overlay-container">
    <div class="card" id="card1" onclick="selectCard('card1')">
      <div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back"></div>
      </div>
    </div>
    <div class="card" id="card2" onclick="selectCard('card2')">
      <div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back"></div>
      </div>
    </div>
    <div class="card" id="card3" onclick="selectCard('card3')">
      <div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back"></div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isClient = urlParams.get('client') === 'true';

    // Ably Setup
    const ably = new Ably.Realtime('PaqQqA.Z2mwNw:eC01Vbna9gRftKwSPQAGqQAX4_3aXU4alNy342yGYK8');
    const channel = ably.channels.get('connectifit-cards');

    let hasSelected = false;

    function selectCard(cardId) {
      if (hasSelected && isClient) return;

      flipAndHighlight(cardId);
      channel.publish('card-flip', { cardId: cardId });

      if (isClient) {
        hasSelected = true;
        lockOtherCards(cardId);
      }
    }

    function flipAndHighlight(cardId) {
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.add('flipped');
      }
    }

    function lockOtherCards(selectedId) {
      ['card1', 'card2', 'card3'].forEach(id => {
        if (id !== selectedId) {
          const card = document.getElementById(id);
          if (card) card.classList.add('disabled');
        }
      });
    }

    // Listen for Sync Signals (Streamlabs)
    channel.subscribe('card-flip', (message) => {
      if (!isClient) {
        flipAndHighlight(message.data.cardId);
      }
    });
  </script>
</body>
</html>
